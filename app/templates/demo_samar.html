<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détection d'instances — Samar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,640&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f3efe7;
            --ink: #1c1917;
            --soft: #57534e;
            --muted: #8a8178;
            --line: rgba(28, 25, 23, .12);
            --card: rgba(255, 252, 247, .9);
            --accent: #1d4ed8;
            --accent-deep: #1e3a8a;
            --shadow: 0 24px 60px -36px rgba(48, 36, 22, .55);
            --serif: "Fraunces", Georgia, serif;
            --sans: "Outfit", "Segoe UI", sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--sans);
            color: var(--ink);
            background:
                radial-gradient(820px 380px at 100% -10%, rgba(29, 78, 216, .12), transparent 60%),
                var(--bg);
            min-height: 100vh;
        }

        .shell { max-width: 820px; margin: 0 auto; padding: 1.4rem 1.4rem 4rem; }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.8rem;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: .7rem;
            text-decoration: none;
            font-weight: 600;
            color: inherit;
        }

        .brand-mark {
            width: 34px; height: 34px; border-radius: 11px;
            display: grid; place-items: center; color: #f8f5ef;
            background: linear-gradient(160deg, #1e3a8a, #1d4ed8);
            font-family: var(--serif); font-size: 1.15rem;
        }

        .back { color: var(--soft); text-decoration: none; font-size: .9rem; }
        .back:hover { color: var(--ink); }

        .eyebrow {
            color: var(--accent);
            font-size: .75rem;
            font-weight: 600;
            letter-spacing: .14em;
            text-transform: uppercase;
            margin-bottom: .55rem;
        }

        h1 {
            font-family: var(--serif);
            font-weight: 520;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            letter-spacing: -.04em;
            line-height: 1;
        }

        .subtitle {
            margin: .7rem 0 1.4rem;
            color: var(--soft);
            font-weight: 300;
            max-width: 46ch;
            line-height: 1.55;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            margin-bottom: 1rem;
        }

        .card h2 {
            font-family: var(--serif);
            font-weight: 520;
            font-size: 1.35rem;
            letter-spacing: -.03em;
            margin-bottom: .9rem;
        }

        .drop-zone {
            border: 1.5px dashed rgba(28, 25, 23, .22);
            border-radius: 18px;
            min-height: 168px;
            display: grid;
            place-items: center;
            text-align: center;
            cursor: pointer;
            transition: border-color .2s, background .2s;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent);
            background: #eff6ff;
        }

        .drop-mark {
            width: 42px; height: 42px; margin: 0 auto .7rem;
            border-radius: 14px; border: 1px solid var(--line);
            display: grid; place-items: center;
            font-family: var(--serif); font-size: 1.3rem; color: var(--accent);
            background: #fff;
        }

        .drop-zone p { font-weight: 500; }
        .drop-zone span { display: block; margin-top: .3rem; color: var(--muted); font-size: .82rem; }
        #fileInput { display: none; }

        .preview-wrap { margin-top: 1rem; text-align: center; }
        #preview, #annotatedPreview {
            max-width: 100%;
            max-height: 420px;
            border-radius: 16px;
            border: 1px solid var(--line);
        }

        .btn {
            width: 100%;
            margin-top: 1rem;
            min-height: 48px;
            border: 0;
            border-radius: 14px;
            background: var(--ink);
            color: #f8f5ef;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 560;
            cursor: pointer;
        }

        .btn:hover { background: var(--accent-deep); }
        .btn:disabled { background: #e7e5e4; color: #a8a29e; cursor: not-allowed; }

        .result-card { display: none; }
        .result-card.show { display: block; }

        .det-count {
            font-family: var(--serif);
            font-size: 1.7rem;
            letter-spacing: -.03em;
            margin-bottom: .85rem;
        }

        .det-list { display: flex; flex-direction: column; gap: .5rem; margin-top: .9rem; }
        .det-item {
            display: flex; justify-content: space-between; align-items: center; gap: .6rem;
            padding: .7rem .85rem; border-radius: 14px;
            background: #fff; border: 1px solid var(--line); font-size: .88rem;
        }
        .det-label { font-weight: 600; }
        .det-box { color: var(--muted); font-size: .75rem; }
        .det-score {
            background: #eff6ff; color: var(--accent-deep);
            padding: .2rem .55rem; border-radius: 999px; font-size: .75rem; font-weight: 600;
        }
        .no-detect { text-align: center; color: var(--muted); padding: .8rem 0 .2rem; }

        .error-msg {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
            padding: .85rem 1rem;
            border-radius: 14px;
            margin-bottom: 1rem;
        }
        .error-msg.show { display: block; }

        .spinner { display: none; text-align: center; color: var(--soft); padding: .2rem 0 1rem; }
        .spinner.show { display: block; }
        .spinner::after {
            content: "";
            display: inline-block;
            width: 16px; height: 16px;
            margin-left: .55rem;
            border: 2px solid rgba(28,25,23,.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            vertical-align: -2px;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            .shell { padding-inline: 1rem; }
        }
    </style>
</head>
<body>
<div class="shell">
    <nav>
        <a class="brand" href="/">
            <span class="brand-mark">A</span>
            Anomalie
        </a>
        <a class="back" href="/">Retour à l'accueil</a>
    </nav>

    <p class="eyebrow">Samar</p>
    <h1>Repérer une instance</h1>
    <p class="subtitle">Mask R-CNN dessine chaque anomalie : boîte, score de confiance et masque.</p>

    <section class="card">
        <h2>Importer une image</h2>
        <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
            <div>
                <div class="drop-mark">+</div>
                <p>Déposez une image, ou cliquez pour la choisir</p>
                <span>PNG, JPG, BMP, WEBP</span>
            </div>
            <input type="file" id="fileInput" accept="image/*">
        </div>
        <div class="preview-wrap" id="previewWrap" style="display:none">
            <img id="preview" alt="Aperçu de l'image envoyée">
        </div>
        <button class="btn" id="predictBtn" onclick="predict()" disabled>Lancer la détection</button>
    </section>

    <div class="error-msg" id="errorMsg"></div>
    <div class="spinner" id="spinner">Détection en cours</div>

    <section class="card result-card" id="detectResult">
        <h2>Résultat</h2>
        <div class="det-count" id="detCount"></div>
        <img id="annotatedPreview" alt="Image annotée par le modèle">
        <div class="det-list" id="detList"></div>
    </section>
</div>

<script>
    let selectedFile = null;

    const fileInput = document.getElementById("fileInput");
    const dropZone  = document.getElementById("dropZone");

    fileInput.addEventListener("change", e => handleFile(e.target.files[0]));
    ["dragover","dragenter"].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.add("dragover"); }));
    ["dragleave","drop"].forEach(ev =>
        dropZone.addEventListener(ev, e => { e.preventDefault(); dropZone.classList.remove("dragover"); }));
    dropZone.addEventListener("drop", e => handleFile(e.dataTransfer.files[0]));

    function handleFile(file) {
        if (!file) return;
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = e => {
            document.getElementById("preview").src = e.target.result;
            document.getElementById("previewWrap").style.display = "block";
        };
        reader.readAsDataURL(file);
        document.getElementById("predictBtn").disabled = false;
        document.getElementById("detectResult").classList.remove("show");
        document.getElementById("errorMsg").classList.remove("show");
    }

    async function predict() {
        if (!selectedFile) return;
        const btn     = document.getElementById("predictBtn");
        const spinner = document.getElementById("spinner");
        const errBox  = document.getElementById("errorMsg");

        btn.disabled = true;
        spinner.classList.add("show");
        errBox.classList.remove("show");
        document.getElementById("detectResult").classList.remove("show");

        const formData = new FormData();
        formData.append("image", selectedFile);

        try {
            const res  = await fetch("/predict/detect", { method: "POST", body: formData });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || "Échec de la détection");
            showDetection(data.result);
        } catch (err) {
            errBox.textContent = err.message;
            errBox.classList.add("show");
        } finally {
            btn.disabled = false;
            spinner.classList.remove("show");
        }
    }

    function showDetection(result) {
        const n = result.num_detections;
        document.getElementById("detCount").textContent =
            n === 0 ? "Aucune anomalie détectée" :
            n === 1 ? "1 anomalie détectée" :
            n + " anomalies détectées";

        document.getElementById("annotatedPreview").src = result.annotated_image;

        const list = document.getElementById("detList");
        list.innerHTML = "";

        if (n === 0) {
            list.innerHTML = '<div class="no-detect">Aucun objet détecté avec un score d’au moins 50 %.</div>';
        } else {
            result.detections.forEach(d => {
                const item = document.createElement("div");
                item.className = "det-item";
                item.innerHTML =
                    `<span class="det-label">${d.label}</span>` +
                    `<span class="det-box">[${d.box.map(v => Math.round(v)).join(", ")}]</span>` +
                    `<span class="det-score">${(d.score * 100).toFixed(1)}%</span>`;
                list.appendChild(item);
            });
        }

        document.getElementById("detectResult").classList.add("show");
    }
</script>
</body>
</html>
